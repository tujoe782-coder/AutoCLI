        const generateBtn = buttons.find(b => {
          const txt = (b.innerText || '').trim();
          return /^生成/.test(txt) && !txt.includes('快速');
        });
        const fastBtn = buttons.find(b => (b.innerText || '').includes('快速生成'));
        const generateText = generateBtn ? (generateBtn.innerText || '').trim().replace(/\n/g, ' ') : 'MISSING';
        const costMatch = generateText.match(/^生成\s*(\d+(?:\.\d+)?)/);
        const currentCost = costMatch ? parseFloat(costMatch[1]) : null;
        const costStable = currentCost === window.__omniCost;
        window.__omniGenBtnFound = !!generateBtn;
        window.__omniIsPriority = currentCost && currentCost > 0;

        // Re-stash gen btn coord (may shift)
        if (generateBtn) {
