  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        const start = Date.now();
        let seen = false;
        let seenAt = 0;
        let seenText = '';
        // Poll up to 20s for the success toast string
        for (let i = 0; i < 40; i++) {
          const all = (document.body && document.body.innerText) || '';
          if (/任務提交成功|已成功建立\s*\d+\s*個任務|提交成功|Generation\s+started|Successfully\s+(submitted|created)/i.test(all)) {
            seen = true;
            seenAt = Date.now() - start;
            // Extract the matching toast text
            const els = Array.from(document.querySelectorAll('*')).filter(e => {
              const t = (e.textContent || '').trim();
              return /任務提交成功|已成功建立\s*\d+\s*個任務/.test(t) && t.length < 100 && e.children.length < 5;
            });
            seenText = els[0] ? (els[0].textContent || '').trim().slice(0, 60) : '<found via body text>';
            break;
          }
          await new Promise(r => setTimeout(r, 500));
        }
        log('P4.2.5.toast-wait', seen ? 'OK' : 'WARN',
          seen ? `success toast detected at +${seenAt}ms · text='${seenText}'`
               : `NO success toast in 20s · submit likely failed silent`);
