        let freshX = staleX, freshY = staleY;
        let freshGenText = 'MISSING';
        let elFromPointInfo = 'no-fresh-btn';
        if (genBtnFresh) {
          const gr = genBtnFresh.getBoundingClientRect();
          freshX = Math.round(gr.left + gr.width / 2);
          freshY = Math.round(gr.top + gr.height / 2);
          freshGenText = (genBtnFresh.innerText || '').trim().replace(/\n/g, ' ').slice(0, 20);
          const elAt = document.elementFromPoint(freshX, freshY);
          const elAtIsGen = elAt && (elAt === genBtnFresh || genBtnFresh.contains(elAt) || elAt.contains(genBtnFresh));
