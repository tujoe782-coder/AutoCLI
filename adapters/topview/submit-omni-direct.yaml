# S326 v2 · Path A · 2-chip direct upload · INCREMENTAL DEBUG BUILD
# Starts from upload-to-chip-test (proven) · adds 2nd upload-file only.
# Steps to add incrementally if this works: P1.5 priority · P1.6/P1.7 dropdowns · P3 prompt · P4 submit.

site: topview
name: submit-omni-direct
description: Topview Seedance 2-chip direct upload (S326 Path A · v2 minimal · incremental debug)
domain: www.topview.ai
strategy: cookie
browser: true
timeoutSeconds: 600

args:
  file_path_1:
    type: string
    required: true
    description: Absolute path · chip slot 1 → @Image1
  file_path_2:
    type: string
    required: true
    description: Absolute path · chip slot 2 → @Image2
  resolution:
    type: string
    default: "480p"
    description: 480p | 720p | 1080p (default 480p)
  duration:
    type: int
    default: 4
    description: 4 | 5 | 6 | 8 | 10 | 15 seconds (default 4)
  prompt:
    type: string
    required: true
    description: Prose with @Image1 + @Image2 markers · structure "[prose0] @Image1 [prose1] @Image2 [prose2]" · max 15000 chars
  output_name:
    type: string
    required: true
    description: Output identifier (logged)

columns: [phase, status, detail]

pipeline:
  - navigate: https://www.topview.ai/board/4cc8183920c849cca4a871c58651e1b3
  - wait: 5

  # ───────────────────────────────────────────────────────────────────────────
  # P0 · INIT window state from args (for P1.6/P1.7/P1.8 to read)
  # ───────────────────────────────────────────────────────────────────────────
  - evaluate: |
      (() => {
        window.__omniLog = [];
        window.__omniAbort = false;
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        const target_resolution = ${{ args.resolution | json }};
        const target_duration = ${{ args.duration | json }};
        const prompt = ${{ args.prompt | json }};
        const output_name = ${{ args.output_name | json }};
        const COST_PER_SEC = { '480p': 0.5, '720p': 1.0, '1080p': 2.5 };
        window.__omniTargetRes = String(target_resolution).toLowerCase();
        window.__omniTargetDur = parseInt(target_duration);
        window.__omniExpectedCost = COST_PER_SEC[window.__omniTargetRes] * window.__omniTargetDur;
        window.__omniOutputName = output_name;

        // Parse prompt into prose0/1/2 around @Image1/@Image2 markers
        const tokens = prompt.split(/(@Image\d+)/);
        const segments = [];
        const chipsFound = new Set();
        for (const t of tokens) {
          const m = t.match(/^@Image(\d+)$/);
          if (m) { chipsFound.add(parseInt(m[1])); segments.push({ type: 'chip', n: parseInt(m[1]) }); }
          else if (t) { segments.push({ type: 'prose', text: t }); }
        }
        if (!chipsFound.has(1) || !chipsFound.has(2) || chipsFound.size !== 2) {
          log('P0', 'FAIL', `CHIPS_MISMATCH expected {1,2} got {${[...chipsFound].sort().join(',')}}`);
          window.__omniAbort = true;
          return { ok: false };
        }
        const chipSeq = segments.filter(s => s.type === 'chip').map(s => s.n);
        if (chipSeq.join(',') !== '1,2') {
          log('P0', 'FAIL', `CHIP_ORDER_WRONG got [${chipSeq.join(',')}]`);
          window.__omniAbort = true;
          return { ok: false };
        }
        let prose0 = '', prose1 = '', prose2 = '';
        let phase = 0;
        for (const seg of segments) {
          if (seg.type === 'chip') { phase++; continue; }
          if (phase === 0) prose0 += seg.text;
          else if (phase === 1) prose1 += seg.text;
          else prose2 += seg.text;
        }
        window.__omniProse0 = prose0;
        window.__omniProse1 = prose1;
        window.__omniProse2 = prose2;

        log('P0', 'OK', `res=${window.__omniTargetRes} dur=${window.__omniTargetDur}s expectedCost=${window.__omniExpectedCost}cr · prose0=${prose0.length}c prose1=${prose1.length}c prose2=${prose2.length}c output=${output_name}`);
        return { ok: true };
      })()

  # ───────────────────────────────────────────────────────────────────────────
  # P1 · minimal panel switch (mirror upload-to-chip-test · proven)
  # ───────────────────────────────────────────────────────────────────────────
  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });

        const mkClick = async (el) => {
          if (!el) return;
          const r = el.getBoundingClientRect();
          const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          ['pointerover','pointerenter'].forEach(t => el.dispatchEvent(new PointerEvent(t, { bubbles:true, cancelable:true, clientX:cx, clientY:cy })));
          ['mouseover','mouseenter'].forEach(t => el.dispatchEvent(new MouseEvent(t, { bubbles:true, cancelable:true, clientX:cx, clientY:cy })));
          await new Promise(r => setTimeout(r, 200));
          el.dispatchEvent(new PointerEvent('pointerdown', { bubbles:true, cancelable:true, clientX:cx, clientY:cy }));
          el.dispatchEvent(new MouseEvent('mousedown', { bubbles:true, cancelable:true, clientX:cx, clientY:cy, button:0 }));
          el.dispatchEvent(new PointerEvent('pointerup', { bubbles:true, cancelable:true, clientX:cx, clientY:cy }));
          el.dispatchEvent(new MouseEvent('mouseup', { bubbles:true, cancelable:true, clientX:cx, clientY:cy, button:0 }));
          el.dispatchEvent(new MouseEvent('click', { bubbles:true, cancelable:true, clientX:cx, clientY:cy, button:0 }));
          if (typeof el.click === 'function') el.click();
        };
        window.__omniClick = mkClick;  // expose for P1.6/P1.7 to use

        const videoBtn = Array.from(document.querySelectorAll('button')).find(b => (b.innerText || '').trim() === '影片');
        if (!videoBtn) { log('P1.1', 'FAIL', 'VIDEO_BTN_NOT_FOUND'); return { ok:false }; }
        await mkClick(videoBtn);
        await new Promise(r => setTimeout(r, 5500));
        log('P1.1', 'OK', '影片 panel opened');

        const seedanceBtn = Array.from(document.querySelectorAll('button')).find(b => (b.innerText || '').includes('全參考'));
        if (!seedanceBtn) { log('P1.2', 'FAIL', 'SEEDANCE_BTN_NOT_FOUND'); return { ok:false }; }
        await mkClick(seedanceBtn);
        await new Promise(r => setTimeout(r, 3000));
        log('P1.2', 'OK', 'SEEDANCE2 panel opened');
        return { ok: true };
      })()



  # P1.5 · CHEVRON CLICK → 點數模式 → verify priority active
  # (S317 chevron-recon verbatim coords · CDP trusted · evaluate-cdp pattern)
  # ===========================================================================

  # P1.5.1 chevron click @ (478, 721)
  - evaluate: |
      ({ x: 478, y: 721 })
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseMoved
        x: ${{ data.x }}
        y: ${{ data.y }}
        button: none
        buttons: 0
        clickCount: 0

  - evaluate: |
      ({ x: 478, y: 721 })
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mousePressed
        x: ${{ data.x }}
        y: ${{ data.y }}
        button: left
        buttons: 1
        clickCount: 1

  - evaluate: |
      ({ x: 478, y: 721 })
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseReleased
        x: ${{ data.x }}
        y: ${{ data.y }}
        button: left
        buttons: 0
        clickCount: 1

  - wait: 2

  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        // Detect if chevron click opened popup (popup may already be in priority state from prior session)
        const buttons = Array.from(document.querySelectorAll('button'));
        const generateBtn = buttons.find(b => {
          const txt = (b.innerText || '').trim();
          return /^生成/.test(txt) && !txt.includes('快速');
        });
        if (generateBtn) {
          const genText = (generateBtn.innerText || '').trim().replace(/\n/g, ' ');
          // Priority active = "生成 N" where N > 0 (7.5 / 15 / 30 etc · resolution-dependent)
          const isPriority = /^生成\s*(\d+(?:\.\d+)?)/.test(genText) && !/^生成\s*0(?:\s|$)/.test(genText);
          log('P1.5.1', isPriority ? 'OK' : 'INFO', `pre-click-點數模式 gen='${genText}' isPriority=${isPriority}`);
          if (isPriority) {
            // Already in priority mode · skip 點數模式 click (chevron click may have just toggled popup or noop)
            log('P1.5.skip', 'OK', 'priority mode already active · skipping 點數模式 click');
            window.__omniPrioritySkipClick = true;
          } else {
            window.__omniPrioritySkipClick = false;
          }
        }
        return { ok: true };
      })()

  # P1.5.2 點數模式 click @ (346, 549) — only if needed
  - evaluate: |
      (async () => {
        if (window.__omniPrioritySkipClick) return { x: 0, y: 0 };
        return { x: 346, y: 549 };
      })()
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseMoved
        x: ${{ data.x }}
        y: ${{ data.y }}
        button: none
        buttons: 0
        clickCount: 0

  - evaluate: |
      (async () => {
        if (window.__omniPrioritySkipClick) return { x: 0, y: 0 };
        return { x: 346, y: 549 };
      })()
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mousePressed
        x: ${{ data.x }}
        y: ${{ data.y }}
        button: left
        buttons: 1
        clickCount: 1

  - evaluate: |
      (async () => {
        if (window.__omniPrioritySkipClick) return { x: 0, y: 0 };
        return { x: 346, y: 549 };
      })()
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseReleased
        x: ${{ data.x }}
        y: ${{ data.y }}
        button: left
        buttons: 0
        clickCount: 1

  - wait: 2

  # P1.5.3 verify priority active · capture cost
  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        const buttons = Array.from(document.querySelectorAll('button'));
        const generateBtn = buttons.find(b => {
          const txt = (b.innerText || '').trim();
          return /^生成/.test(txt) && !txt.includes('快速');
        });
        if (!generateBtn) {
          log('P1.5.3', 'FAIL', 'GENERATE_BTN_NOT_FOUND post mode switch');
          window.__omniAbort = true;
          return { ok: false };
        }
        const genText = (generateBtn.innerText || '').trim().replace(/\n/g, ' ');
        const costMatch = genText.match(/^生成\s*(\d+(?:\.\d+)?)/);
        const cost = costMatch ? parseFloat(costMatch[1]) : null;
        if (!cost || cost <= 0) {
          log('P1.5.3', 'FAIL', `gen btn='${genText}' (expected '生成 N' with N>0) · priority mode switch FAILED`);
          window.__omniAbort = true;
          return { ok: false };
        }
        const gr = generateBtn.getBoundingClientRect();
        window.__omniGenBtnX = Math.round(gr.left + gr.width / 2);
        window.__omniGenBtnY = Math.round(gr.top + gr.height / 2);
        window.__omniCost = cost;
        window.__omniPriorityActive = true;
        log('P1.5.3', 'OK', `priority active · gen='${genText}' cost=${cost} cr · genBtn=(${window.__omniGenBtnX},${window.__omniGenBtnY})`);
        return { ok: true };
      })()


  # ===========================================================================
  # P1.6 · RESOLUTION set (S318 gh#27 ship · v2 DOM-direct pointer events)
  # Pattern: locate button + click via mkPointerSeq · wait · locate option + click · verify
  # All in 3 evaluates (no CDP steps · DOM events trusted by Topview React)
  # ===========================================================================

  # P1.6.A click resolution dropdown button via mkPointerSeq (or skip if already correct)
  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        if (window.__omniAbort) { log('P1.6.A', 'SKIP', 'aborted'); return { ok: false }; }

        const buttons = Array.from(document.querySelectorAll('button'));
        const resBtn = buttons.find(b => {
          const txt = (b.innerText || '').trim();
          const r = b.getBoundingClientRect();
          return /^(480p|720p|1080p)$/i.test(txt) && r.width > 100 && r.width < 300 && r.height > 20 && r.height < 50;
        });
        if (!resBtn) {
          log('P1.6.A', 'FAIL', 'RESOLUTION_BTN_NOT_FOUND');
          window.__omniAbort = true;
          return { ok: false };
        }
        const currentRes = (resBtn.innerText || '').trim().toLowerCase();
        const targetRes = window.__omniTargetRes;
        const r = resBtn.getBoundingClientRect();
        window.__omniResBtnX = Math.round(r.left + r.width / 2);
        window.__omniResBtnY = Math.round(r.top + r.height / 2);

        if (currentRes === targetRes) {
          window.__omniResSkipClick = true;
          log('P1.6.A', 'OK', `already=${currentRes} target=${targetRes} · skipping dropdown`);
          return { ok: true };
        }
        window.__omniResSkipClick = false;

        // Click via mkPointerSeq (DOM-direct trusted by Topview React)
        await window.__omniClick(resBtn);
        await new Promise(r => setTimeout(r, 1500));
        log('P1.6.A', 'OK', `current=${currentRes} target=${targetRes} · clicked btn · waited 1.5s for popup`);
        return { ok: true };
      })()

  # P1.6.B locate + click target resolution option in popup
  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        if (window.__omniAbort || window.__omniResSkipClick) {
          log('P1.6.B', 'SKIP', window.__omniResSkipClick ? 'already correct' : 'aborted');
          return { ok: false };
        }
        const targetRes = window.__omniTargetRes;
        const targetResUpper = targetRes.toUpperCase();
        const targetResNum = targetRes.replace(/p$/i, '');

        const allEls = Array.from(document.querySelectorAll('*'));
        const candidates = allEls.filter(el => {
          if (el.children.length > 0) return false;
          const t = (el.innerText || '').trim();
          if (!t) return false;
          const r = el.getBoundingClientRect();
          if (r.width < 5 || r.height < 5 || r.width > 400 || r.height > 80) return false;
          return t === targetRes || t === targetResUpper || t === targetResNum
              || t.toLowerCase().startsWith(targetRes + ' ')
              || t.toLowerCase().startsWith(targetRes + '(');
        });
        const opts = candidates.filter(el => {
          const r = el.getBoundingClientRect();
          const cx = Math.round(r.left + r.width / 2);
          const cy = Math.round(r.top + r.height / 2);
          return Math.abs(cx - window.__omniResBtnX) > 5 || Math.abs(cy - window.__omniResBtnY) > 5;
        });

        if (opts.length === 0) {
          // Forensic dump
          const dumpEls = allEls.filter(el => {
            if (el.children.length > 0) return false;
            const t = (el.innerText || '').trim();
            if (!t || t.length > 40) return false;
            const r = el.getBoundingClientRect();
            if (r.width < 5 || r.height < 5) return false;
            return r.top > 100 && r.top < 900 && r.left > 0 && r.left < 600;
          }).slice(0, 50);
          const dumpStr = dumpEls.map(el => {
            const r = el.getBoundingClientRect();
            return `${el.tagName}@(${Math.round(r.left+r.width/2)},${Math.round(r.top+r.height/2)})='${(el.innerText || '').trim().slice(0,25)}'`;
          }).join(' | ');
          log('P1.6.B-DEBUG', 'INFO', `panel dump (${dumpEls.length}): ${dumpStr.slice(0, 900)}`);
          log('P1.6.B', 'FAIL', `RES_OPT_NOT_FOUND target=${targetRes} candidates=${candidates.length}`);
          window.__omniAbort = true;
          return { ok: false };
        }
        const opt = opts[0];
        await window.__omniClick(opt);
        await new Promise(r => setTimeout(r, 1500));
        log('P1.6.B', 'OK', `clicked target option ${opt.tagName} text='${(opt.innerText||'').trim()}'`);
        return { ok: true };
      })()

  # P1.6.C verify resolution applied
  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        if (window.__omniAbort) { log('P1.6.C', 'SKIP', 'aborted'); return { ok: false }; }
        const buttons = Array.from(document.querySelectorAll('button'));
        const resBtn = buttons.find(b => {
          const txt = (b.innerText || '').trim();
          const r = b.getBoundingClientRect();
          return /^(480p|720p|1080p)$/i.test(txt) && r.width > 100 && r.width < 300 && r.height > 20 && r.height < 50;
        });
        const currentRes = resBtn ? (resBtn.innerText || '').trim().toLowerCase() : 'MISSING';
        const targetRes = window.__omniTargetRes;
        const ok = currentRes === targetRes;
        log('P1.6.C', ok ? 'OK' : 'FAIL', `post-click resolution='${currentRes}' target='${targetRes}' match=${ok}`);
        if (!ok) window.__omniAbort = true;
        return { ok };
      })()

  # ===========================================================================
  # P1.7 · DURATION set (S318 gh#27 ship · v2 DOM-direct pointer events)
  # ===========================================================================

  # P1.7.A click duration dropdown button via mkPointerSeq (or skip if already correct)
  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        if (window.__omniAbort) { log('P1.7.A', 'SKIP', 'aborted'); return { ok: false }; }

        const buttons = Array.from(document.querySelectorAll('button'));
        const durBtn = buttons.find(b => {
          const txt = (b.innerText || '').trim();
          const r = b.getBoundingClientRect();
          return /^\d+s$/.test(txt) && r.width > 100 && r.width < 300 && r.height > 20 && r.height < 50;
        });
        if (!durBtn) {
          log('P1.7.A', 'FAIL', 'DURATION_BTN_NOT_FOUND');
          window.__omniAbort = true;
          return { ok: false };
        }
        const currentDurStr = (durBtn.innerText || '').trim();
        const currentDur = parseInt(currentDurStr.replace('s', ''));
        const targetDur = window.__omniTargetDur;
        const r = durBtn.getBoundingClientRect();
        window.__omniDurBtnX = Math.round(r.left + r.width / 2);
        window.__omniDurBtnY = Math.round(r.top + r.height / 2);

        if (currentDur === targetDur) {
          window.__omniDurSkipClick = true;
          log('P1.7.A', 'OK', `already=${currentDur}s target=${targetDur}s · skipping`);
          return { ok: true };
        }
        window.__omniDurSkipClick = false;

        await window.__omniClick(durBtn);
        await new Promise(r => setTimeout(r, 1500));
        log('P1.7.A', 'OK', `current=${currentDur}s target=${targetDur}s · clicked btn · waited 1.5s`);
        return { ok: true };
      })()

  # P1.7.B locate + click target duration option
  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        if (window.__omniAbort || window.__omniDurSkipClick) {
          log('P1.7.B', 'SKIP', window.__omniDurSkipClick ? 'already correct' : 'aborted');
          return { ok: false };
        }
        const targetDurStr = `${window.__omniTargetDur}s`;
        const allEls = Array.from(document.querySelectorAll('*'));
        const candidates = allEls.filter(el => {
          const t = (el.innerText || '').trim();
          if (t !== targetDurStr) return false;
          if (el.children.length > 0) return false;
          const r = el.getBoundingClientRect();
          return r.width > 5 && r.height > 5 && r.width < 250 && r.height < 50;
        });
        const opts = candidates.filter(el => {
          const r = el.getBoundingClientRect();
          const cx = Math.round(r.left + r.width / 2);
          const cy = Math.round(r.top + r.height / 2);
          return Math.abs(cx - window.__omniDurBtnX) > 5 || Math.abs(cy - window.__omniDurBtnY) > 5;
        });
        if (opts.length === 0) {
          log('P1.7.B', 'FAIL', `DUR_OPT_NOT_FOUND target=${targetDurStr} candidates=${candidates.length}`);
          window.__omniAbort = true;
          return { ok: false };
        }
        const opt = opts[0];
        await window.__omniClick(opt);
        await new Promise(r => setTimeout(r, 1500));
        log('P1.7.B', 'OK', `clicked target option ${opt.tagName} text='${(opt.innerText||'').trim()}'`);
        return { ok: true };
      })()

  # P1.7.C verify duration applied
  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        if (window.__omniAbort) { log('P1.7.C', 'SKIP', 'aborted'); return { ok: false }; }
        const buttons = Array.from(document.querySelectorAll('button'));
        const durBtn = buttons.find(b => {
          const txt = (b.innerText || '').trim();
          const r = b.getBoundingClientRect();
          return /^\d+s$/.test(txt) && r.width > 100 && r.width < 300 && r.height > 20 && r.height < 50;
        });
        const currentDur = durBtn ? parseInt((durBtn.innerText || '').trim().replace('s', '')) : null;
        const targetDur = window.__omniTargetDur;
        const ok = currentDur === targetDur;
        log('P1.7.C', ok ? 'OK' : 'FAIL', `post-click duration='${currentDur}s' target='${targetDur}s' match=${ok}`);
        if (!ok) window.__omniAbort = true;
        return { ok };
      })()

  # ===========================================================================
  # P1.8 · COST verify · gen btn text must match expected_cost from P0 matrix
  # ===========================================================================
  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        if (window.__omniAbort) { log('P1.8', 'SKIP', 'aborted'); return { ok: false }; }
        const buttons = Array.from(document.querySelectorAll('button'));
        const generateBtn = buttons.find(b => {
          const txt = (b.innerText || '').trim();
          return /^生成/.test(txt) && !txt.includes('快速');
        });
        if (!generateBtn) {
          log('P1.8', 'FAIL', 'GENERATE_BTN_MISSING post resolution+duration set');
          window.__omniAbort = true;
          return { ok: false };
        }
        const genText = (generateBtn.innerText || '').trim().replace(/\n/g, ' ');
        const costMatch = genText.match(/^生成\s*(\d+(?:\.\d+)?)/);
        const currentCost = costMatch ? parseFloat(costMatch[1]) : null;
        const expectedCost = window.__omniExpectedCost;
        // S319 Sunny lock · exact match (tolerance=0) · pre gh#29 was 0.01 · now matrix verified Cowork S319 → no slack needed
        const ok = currentCost !== null && currentCost === expectedCost;
        window.__omniCost = currentCost;  // refresh from current state (overrides P1.5.3 stale value)
        // refresh gen btn coord too (may have shifted after dropdown changes)
        const gr = generateBtn.getBoundingClientRect();
        window.__omniGenBtnX = Math.round(gr.left + gr.width / 2);
        window.__omniGenBtnY = Math.round(gr.top + gr.height / 2);
        log('P1.8', ok ? 'OK' : 'FAIL', `cost match · gen='${genText}' current=${currentCost} expected=${expectedCost} · res=${window.__omniTargetRes} dur=${window.__omniTargetDur}s · genBtn=(${window.__omniGenBtnX},${window.__omniGenBtnY})`);
        if (!ok) {
          window.__omniAbort = true;
        }
        return { ok };
      })()


  # ───────────────────────────────────────────────────────────────────────────
  # P2 · upload-file-trusted (S326 ship) — 1 call, 2 files via input.multiple=true
  # NOTE: 5s wait BEFORE upload to let React settle after dropdowns (P1.6/P1.7 popovers close → upload box re-renders)
  # 替換歷史:S321 drag-drop sim (button has no onDrop · isTrusted=false rejected)
  #         → S326 CDP file-chooser intercept + Input.dispatchMouseEvent trusted click + DOM.setFileInputFiles
  #           (verified 2026-05-13: chip 真渲染 + @Image1/@Image2 cyan label · 0 error)
  # ───────────────────────────────────────────────────────────────────────────
  - wait: 5

