# S322 upload-asset v10 · HTTP API + S3 SigV4 direct upload · 0 browser file-input automation
#
# Replaces v9 (direct CDP attach via AUTOCLI_CDP_ENDPOINT · still blocked by Chrome 147).
# v10 bypasses Chrome's DOM.setFileInputFiles lock entirely by going direct to:
#   P1. GET /api/trpc/common.aws.getS3Credentials → STS temp credentials
#   P2. PUT https://aigc.s3.amazonaws.com/board/<id>/upload/<team>/<file>.jpg → S3
#   P3. POST /api/trpc/board.task.create → register asset, get taskId
#
# Uses Main Chrome session cookies (via extension/DaemonPage `pg.cookies()`).
# NO Debug Chrome / --remote-debugging-port required.
#
# Args:
#   file_path · ABSOLUTE local file path (starts with '/')
#   board_id  · 32-hex from board URL https://www.topview.ai/board/<board_id>
#   team_id   · 20-char base64url from x-team-id header (Sunny pre-captures)
#
# v9 preserved as _upload-asset-v9.yaml.bak in same dir.

site: topview
name: upload-asset
description: S322 v10 · HTTP + S3 SigV4 direct upload · bypasses Chrome 147 setFileInputFiles lock
domain: www.topview.ai
strategy: cookie
browser: true
timeoutSeconds: 300

args:
  file_path:
    type: string
    description: ABSOLUTE local file path (starts with '/')
  board_id:
    type: string
    description: Topview board id (32-hex)
  team_id:
    type: string
    description: Topview team id (20-char · same as x-team-id header in browser)

columns: [phase, status, detail]

pipeline:
  # Pre · Navigate to board (establishes session cookie context for FetchStep)
  - navigate: "https://www.topview.ai/board/${{ args.board_id }}"
  - wait: 2

  # P1 · GET STS temp credentials
  - fetch:
      url: "https://www.topview.ai/api/trpc/common.aws.getS3Credentials?batch=1&input=%7B%7D"
      method: GET
      useSessionCookies: true
      headers:
        x-team-id: "${{ args.team_id }}"
        x-uid: "${{ args.team_id }}"
        referer: "https://www.topview.ai/board/${{ args.board_id }}"
        accept: "*/*"
        sec-fetch-site: same-origin
        sec-fetch-mode: cors
        sec-fetch-dest: empty
    saveTo: stsResp

  # P2 · SigV4 sign + PUT to S3
  - upload-s3-sigv4:
      filePath: "${{ args.file_path }}"
      accessKeyId: "${{ data.stsResp[0].result.data.data.accessKeyId }}"
      secretAccessKey: "${{ data.stsResp[0].result.data.data.secretAccessKey }}"
      sessionToken: "${{ data.stsResp[0].result.data.data.sessionToken }}"
      bucket: "${{ data.stsResp[0].result.data.data.bucket }}"
      region: "${{ data.stsResp[0].result.data.data.region }}"
      boardId: "${{ args.board_id }}"
      teamId: "${{ args.team_id }}"
    saveTo: putResult

  # P3 · POST register task — full Origin + sec-fetch-* mirror to satisfy NextAuth/tRPC CSRF gate
  #   Server-required fields (discovered via probe 2026-05-12):
  #     - toolType: "user-upload" (Sunny's capture matched this; server rejects without)
  #     - toolCategory: image|video|avatar|voice|music — must match the asset type
  #   (Probe-captured Payload only showed boardId; DevTools may have collapsed nested fields.)
  - fetch:
      url: "https://www.topview.ai/api/trpc/board.task.create?batch=1"
      method: POST
      useSessionCookies: true
      headers:
        x-team-id: "${{ args.team_id }}"
        x-uid: "${{ args.team_id }}"
        content-type: application/json
        origin: "https://www.topview.ai"
        referer: "https://www.topview.ai/board/${{ args.board_id }}"
        sec-fetch-site: same-origin
        sec-fetch-mode: cors
        sec-fetch-dest: empty
      body:
        "0":
          boardId: "${{ args.board_id }}"
          toolType: "user-upload"
          toolCategory: "image"
          parameters:
            fileName: "${{ args.file_path | basename }}"
            fileSize: "${{ data.putResult.contentLength }}"
            mimeType: "${{ data.putResult.mimeType }}"
            s3Path: "${{ data.putResult.s3Path }}"
            source: "upload"
          # S322 F.5: server needs width/height/format to generate CloudFront
          # signed compressedImage URL. Without this, result returns null and
          # UI shows black placeholder. Captured manual upload sends this
          # exact shape (filePath/format/width/height nested under originImage).
          result:
            originImage:
              filePath: "${{ data.putResult.s3Path }}"
              format: "${{ data.putResult.format }}"
              width: "${{ data.putResult.width }}"
              height: "${{ data.putResult.height }}"
    saveTo: taskResp

  # P4 · Surface taskId + s3Path for downstream submit-omni
  # Output goes via the CLI -f json flag which prints final `data` (contains taskResp).
  # Caller (wrapper / submit-omni) parses data.taskResp[0].result.data.data.taskId.
  # No additional step needed — final data is the implicit return value of the pipeline.
