# Topview Seedance 2.0 Omni Reference · minimum-viable hello-world submit (T5)
# Goal: prove fork B path end-to-end · 1 ref emma-face + chip-bound @Image1 + Relax mode 0 cr
#
# CHOOSER FLOW per Cowork S314 verbatim reply (s314-cowork-reply-chooser-verbatim.md):
#   Step 1: hover at (128, 287) · panel 匯入 box CENTER · wait 1500ms (hover-popover render)
#   Step 2: click at (117, 315) · hover-revealed 看板 sub-icon (BOTTOM-LEFT corner of box · CSS opacity 0 unless hover)
#   Step 3: click at (137, 220) · dropdown 「圖片」 item (dropdown floats over textarea · y=220 圖片 / 248 影片 / 277 音訊)
#   Step 4: chooser mode active · click asset card (emma at ~977,240 in ep01-character-bank board · idx 2 of 5)
#   Step 5: chooser auto-closes · slot 1 binds @Image1
# License: Apache-2.0 (same as parent autocli repo)

site: topview
name: hello-world
description: Minimum-viable Topview Seedance Omni Reference submit · 1 ref emma-face + chip-bound prompt + Relax 0 cr · proves fork B path
domain: www.topview.ai
strategy: cookie
browser: true

args: {}

columns: [phase, status, detail]

pipeline:
  # ────────────────────────────────────────────────────────────────────────
  # P1 · navigate + open 影片 panel + open SEEDANCE2 panel
  # ────────────────────────────────────────────────────────────────────────
  - navigate: https://www.topview.ai/board/4cc8183920c849cca4a871c58651e1b3
  - wait: 4

  - evaluate: |
      (async () => {
        window.__hwLog = [];
        const log = (phase, status, detail) => window.__hwLog.push({ phase, status, detail });

        if (document.title.includes('Just a moment') || document.title.includes('正在驗證')) {
          log('P1.0', 'FAIL', 'CLOUDFLARE_BLOCKED'); return { ok: false };
        }

        const mkPointerSeq = async (el) => {
          const r = el.getBoundingClientRect();
          const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          const mk = (t) => new MouseEvent(t, { bubbles: true, cancelable: true, view: window, clientX: cx, clientY: cy, button: 0 });
          el.dispatchEvent(new PointerEvent('pointerover', { bubbles: true, cancelable: true, clientX: cx, clientY: cy }));
          el.dispatchEvent(new PointerEvent('pointerenter', { bubbles: true, cancelable: true, clientX: cx, clientY: cy }));
          el.dispatchEvent(mk('mouseover'));
          el.dispatchEvent(mk('mouseenter'));
          await new Promise(r => setTimeout(r, 200));
          el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, clientX: cx, clientY: cy }));
          el.dispatchEvent(mk('mousedown'));
          el.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true, clientX: cx, clientY: cy }));
          el.dispatchEvent(mk('mouseup'));
          el.dispatchEvent(mk('click'));
          el.click();
        };
        window.__hwClick = mkPointerSeq;

        // 影片 sidebar
        const videoBtn = Array.from(document.querySelectorAll('button')).find(b => (b.innerText || '').trim() === '影片');
        if (!videoBtn) { log('P1.1', 'FAIL', 'VIDEO_BTN_NOT_FOUND'); return { ok: false }; }
        await mkPointerSeq(videoBtn);
        await new Promise(r => setTimeout(r, 5500));
        log('P1.1', 'OK', 'video panel opened · 5500ms wait done');

        // 全參考 SEEDANCE2
        const seedanceBtn = Array.from(document.querySelectorAll('button')).find(b => (b.innerText || '').includes('全參考'));
        if (!seedanceBtn) { log('P1.2', 'FAIL', 'SEEDANCE_BTN_NOT_FOUND'); return { ok: false }; }
        await mkPointerSeq(seedanceBtn);
        await new Promise(r => setTimeout(r, 3000));

        const editables = Array.from(document.querySelectorAll('[contenteditable=true], [contenteditable]'));
        const generateBtn = Array.from(document.querySelectorAll('button')).find(b => /^生成/.test((b.innerText || '').trim()) && !(b.innerText || '').includes('快速'));
        log('P1.2', 'OK', `editable=${editables.length} gen='${generateBtn?(generateBtn.innerText||'').trim().replace(/\n/g,' '):'-'}'`);
        return { ok: true };
      })()

  # ────────────────────────────────────────────────────────────────────────
  # P2 · Cowork verbatim chooser flow (HARDCODED per s314-cowork-reply)
  # ────────────────────────────────────────────────────────────────────────

  # P2.1 · Step 1: HOVER 匯入 box CENTER (128, 287) → wait 1500ms for hover-popover render
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseMoved
        x: 128
        y: 287
        button: none
        buttons: 0
        clickCount: 0

  - wait: 2

  - evaluate: |
      (async () => {
        const log = (phase, status, detail) => window.__hwLog.push({ phase, status, detail });
        // Snapshot hover state · check if hover-popover visible at expected coord
        const elAtSubIcon = document.elementFromPoint(117, 315);
        const elAtDropdown = document.elementFromPoint(137, 220);
        log('P2.1', 'INFO', `post-hover · elAtSubIcon(117,315)=${elAtSubIcon?elAtSubIcon.tagName + '.' + ((elAtSubIcon.className||'')+'').toString().slice(0,30):'null'} text='${(elAtSubIcon?.innerText||'').trim().slice(0,15)}'`);
        return { ok: true };
      })()

  # P2.2 · Step 2: CLICK hover-revealed 看板 sub-icon at (117, 315)
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseMoved
        x: 117
        y: 315
        button: none
        buttons: 0
        clickCount: 0

  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mousePressed
        x: 117
        y: 315
        button: left
        buttons: 1
        clickCount: 1

  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseReleased
        x: 117
        y: 315
        button: left
        buttons: 0
        clickCount: 1

  - wait: 1

  - evaluate: |
      (async () => {
        const log = (phase, status, detail) => window.__hwLog.push({ phase, status, detail });
        // Verify dropdown opened · should see 圖片|影片|音訊 popover
        const elAtImg = document.elementFromPoint(137, 220);
        const elAtVid = document.elementFromPoint(137, 248);
        const elAtAud = document.elementFromPoint(137, 277);
        log('P2.2', 'INFO', `post-click sub-icon · elAt(137,220)=${elAtImg?.tagName||'null'} text='${(elAtImg?.innerText||'').trim().slice(0,15)}' | elAt(137,248)=${elAtVid?.tagName||'null'} text='${(elAtVid?.innerText||'').trim().slice(0,15)}' | elAt(137,277)=${elAtAud?.tagName||'null'} text='${(elAtAud?.innerText||'').trim().slice(0,15)}'`);

        // Also dump any new visible overlays
        const overlays = Array.from(document.querySelectorAll('[role=menu], [role=listbox], [data-state=open], [class*="dropdown"], [class*="popover"]'));
        const visOverlays = overlays.filter(o => { const r = o.getBoundingClientRect(); return r.width > 5 && r.height > 5; });
        for (let i = 0; i < Math.min(visOverlays.length, 3); i++) {
          const o = visOverlays[i];
          const r = o.getBoundingClientRect();
          log('P2.2d', 'INFO', `ovl[${i}] ${o.tagName} role='${o.getAttribute('role')||''}' rect=${Math.round(r.left)},${Math.round(r.top)} ${Math.round(r.width)}x${Math.round(r.height)} text='${(o.innerText||'').slice(0,40).replace(/\n/g,'|')}'`);
        }
        return { ok: true };
      })()

  # P2.3 · Step 3: CLICK 「圖片」 dropdown item at (137, 220)
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseMoved
        x: 137
        y: 220
        button: none
        buttons: 0
        clickCount: 0

  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mousePressed
        x: 137
        y: 220
        button: left
        buttons: 1
        clickCount: 1

  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseReleased
        x: 137
        y: 220
        button: left
        buttons: 0
        clickCount: 1

  - wait: 2

  # P2.4 · verify chooser mode entered + locate emma asset card dynamically
  - evaluate: |
      (async () => {
        const log = (phase, status, detail) => window.__hwLog.push({ phase, status, detail });
        // Look for "選擇圖片素材" header (chooser mode indicator)
        const allEls = Array.from(document.querySelectorAll('*'));
        const chooserHeader = allEls.find(el => /選擇.*素材|Click to add/i.test((el.innerText || '').trim()) && (el.innerText || '').length < 60);
        const cancelBtn = Array.from(document.querySelectorAll('button')).find(b => (b.innerText || '').trim() === '取消');
        const inChooserMode = !!chooserHeader || !!cancelBtn;

        // Find emma asset card · idx 2 of 5 visible CloudFront-signed assets sorted by row+col
        const assetImgs = Array.from(document.querySelectorAll('img')).filter(im => {
          const r = im.getBoundingClientRect();
          return r.width > 50 && r.height > 50 && r.top > 50 && r.top < window.innerHeight - 50
              && (im.src || '').includes('Key-Pair-Id') && !(im.alt || '').match(/Loading|topview/i);
        }).sort((a, b) => {
          const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
          const rowA = Math.round(ra.top / 30), rowB = Math.round(rb.top / 30);
          if (rowA !== rowB) return rowA - rowB;
          return ra.left - rb.left;
        });

        if (assetImgs.length < 3) {
          log('P2.4', 'FAIL', `chooser=${inChooserMode} · only ${assetImgs.length} assets visible · need >=3`);
          // Return sentinel coords (fallback) so cdp doesn't crash
          return { x: 977, y: 240, fail: true };
        }

        const emmaImg = assetImgs[2];
        const r = emmaImg.getBoundingClientRect();
        const emmaX = Math.round(r.left + r.width / 2);
        const emmaY = Math.round(r.top + r.height / 2);

        log('P2.4', inChooserMode ? 'OK' : 'WARN', `chooserMode=${inChooserMode} cancelBtn=${!!cancelBtn} · ${assetImgs.length} assets · emma idx2 coord=(${emmaX},${emmaY})`);
        window.__hwEmmaX = emmaX;
        window.__hwEmmaY = emmaY;
        return { x: emmaX, y: emmaY };
      })()

  # P2.5 · Step 4: CLICK emma asset card to bind @Image1
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseMoved
        x: ${{ data.x }}
        y: ${{ data.y }}
        button: none
        buttons: 0
        clickCount: 0

  - evaluate: |
      ({ x: window.__hwEmmaX || 977, y: window.__hwEmmaY || 240 })

  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mousePressed
        x: ${{ data.x }}
        y: ${{ data.y }}
        button: left
        buttons: 1
        clickCount: 1

  - evaluate: |
      ({ x: window.__hwEmmaX || 977, y: window.__hwEmmaY || 240 })

  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseReleased
        x: ${{ data.x }}
        y: ${{ data.y }}
        button: left
        buttons: 0
        clickCount: 1

  - wait: 2

  # P2.6 · verify slot bound (@Image1 chip should appear in panel slot area)
  - evaluate: |
      (async () => {
        const log = (phase, status, detail) => window.__hwLog.push({ phase, status, detail });
        // Look for slot indicator with Image1 text
        const slotIndicators = Array.from(document.querySelectorAll('div, span, button, img'))
          .filter(el => /^@?Image\s*1$/i.test((el.innerText || '').trim()) && (el.innerText || '').trim().length < 12);
        // Look for slot thumbnail (board asset thumbnail in panel slot area)
        const panelSlotImgs = Array.from(document.querySelectorAll('img')).filter(im => {
          const r = im.getBoundingClientRect();
          return r.left < 510 && r.left > 50 && r.top > 200 && r.top < 500 && r.width > 30 && r.height > 30
              && (im.src || '').includes('Key-Pair-Id');
        });
        // Check chooser still open or closed
        const cancelBtn = Array.from(document.querySelectorAll('button')).find(b => (b.innerText || '').trim() === '取消');
        log('P2.6', slotIndicators.length > 0 || panelSlotImgs.length > 0 ? 'OK' : 'WARN',
          `slotIndicators=${slotIndicators.length} panelSlotImgs=${panelSlotImgs.length} chooserOpen=${!!cancelBtn}`);
        return { ok: slotIndicators.length > 0 || panelSlotImgs.length > 0 };
      })()

  # ────────────────────────────────────────────────────────────────────────
  # P3 · focus contenteditable + chip-binding via cdp
  # ────────────────────────────────────────────────────────────────────────
  - evaluate: |
      (async () => {
        const log = (phase, status, detail) => window.__hwLog.push({ phase, status, detail });
        const editables = Array.from(document.querySelectorAll('[contenteditable=true], [contenteditable]'));
        if (editables.length === 0) { log('P3.1', 'FAIL', 'NO_CONTENTEDITABLE'); return { ok: false }; }
        const target = editables[0];
        const r = target.getBoundingClientRect();
        const cx = r.left + 30, cy = r.top + 30;
        const mk = (t) => new MouseEvent(t, { bubbles: true, cancelable: true, view: window, clientX: cx, clientY: cy, button: 0 });
        target.dispatchEvent(mk('mousedown'));
        target.dispatchEvent(mk('mouseup'));
        target.dispatchEvent(mk('click'));
        target.focus();
        await new Promise(r => setTimeout(r, 400));
        const sel = window.getSelection();
        sel.removeAllRanges();
        const range = document.createRange();
        range.selectNodeContents(target);
        sel.addRange(range);
        log('P3.1', 'OK', `focused=${target === document.activeElement} existing='${(target.innerText || '').slice(0, 40)}'`);
        return { ok: true };
      })()

  - cdp:
      method: Input.insertText
      params:
        text: "Cinematic photorealistic portrait of "

  - wait: 1

  - cdp:
      method: Input.insertText
      params:
        text: "@"

  - wait: 1

  - evaluate: |
      (async () => {
        const log = (phase, status, detail) => window.__hwLog.push({ phase, status, detail });
        const editable = document.querySelector('[contenteditable=true], [contenteditable]');
        const dropdowns = Array.from(document.querySelectorAll('[data-state=open], [role=listbox], [role=menu], [class*="mention"], [class*="autocomplete"]'));
        const visD = dropdowns.filter(d => { const r = d.getBoundingClientRect(); return r.width > 5 && r.height > 5; });
        log('P3.4', visD.length > 0 ? 'OK' : 'WARN',
          `editable_text='${(editable?.innerText || '').slice(0, 60)}' dropdowns=${visD.length}`);
        return { ok: true };
      })()

  # Press Enter via cdp (selects first autocomplete item · @Image1 should be auto-highlighted)
  - cdp:
      method: Input.dispatchKeyEvent
      params:
        type: rawKeyDown
        key: Enter
        code: Enter
        windowsVirtualKeyCode: 13
        nativeVirtualKeyCode: 13

  - cdp:
      method: Input.dispatchKeyEvent
      params:
        type: keyUp
        key: Enter
        code: Enter
        windowsVirtualKeyCode: 13
        nativeVirtualKeyCode: 13

  - wait: 1

  - cdp:
      method: Input.insertText
      params:
        text: " in a bright sunlit room with soft window light. 4 seconds locked-off camera, no movement."

  - wait: 1

  - evaluate: |
      (async () => {
        const log = (phase, status, detail) => window.__hwLog.push({ phase, status, detail });
        const editable = document.querySelector('[contenteditable=true], [contenteditable]');
        if (!editable) { log('P3.7', 'FAIL', 'NO_CONTENTEDITABLE'); window.__hwChipOk = false; return { ok: false }; }
        const text = (editable.innerText || '');
        const chips = Array.from(editable.querySelectorAll('span, div, a, button')).filter(el => {
          const cls = ((el.className || '') + '').toString();
          const txt = (el.innerText || '').trim();
          return (/mention|chip|tag|reference|asset-ref/i.test(cls) && txt.length < 30)
              || /^@?Image\s*\d+$/.test(txt);
        });
        const literalMatch = /@\s*Image\s*\d+/.test(text);
        const chipBound = chips.length > 0 || literalMatch;
        window.__hwChipOk = chipBound;
        log('P3.7', chipBound ? 'OK' : 'FAIL',
          `text_len=${text.length} chips=${chips.length} literal@Image=${literalMatch} preview='${text.slice(0, 90)}'`);
        return { ok: chipBound };
      })()

  # ────────────────────────────────────────────────────────────────────────
  # P4 · pre-submit safety + click 生成 + post-submit verify
  # ────────────────────────────────────────────────────────────────────────
  - evaluate: |
      (async () => {
        const log = (phase, status, detail) => window.__hwLog.push({ phase, status, detail });

        let balanceText = 'UNKNOWN';
        const candidates = Array.from(document.querySelectorAll('button, span, div'));
        for (const el of candidates) {
          if (el.children.length > 5) continue;
          const t = (el.innerText || '').trim();
          if (/^\d{1,5}(?:\.\d+)?\s*\n?\s*Ultra\s*$/.test(t)) {
            balanceText = t.replace(/\s+/g, ' ');
            break;
          }
        }

        const buttons = Array.from(document.querySelectorAll('button'));
        const generateBtn = buttons.find(b => {
          const txt = (b.innerText || '').trim();
          return /^生成/.test(txt) && !txt.includes('快速');
        });
        const fastBtn = buttons.find(b => (b.innerText || '').includes('快速生成'));
        const generateText = generateBtn ? (generateBtn.innerText || '').trim().replace(/\n/g, ' ') : 'MISSING';
        const isRelax = /生成\s*0(?:\s|$)/.test(generateText);
        window.__hwGenBtnFound = !!generateBtn;
        window.__hwIsRelax = isRelax;

        log('P4.1', generateBtn && isRelax ? 'OK' : 'WARN',
          `balance='${balanceText}' gen='${generateText}' fast=${fastBtn ? 'present' : 'absent'} isRelax=${isRelax}`);
        return { ok: true };
      })()

  - evaluate: |
      (async () => {
        const log = (phase, status, detail) => window.__hwLog.push({ phase, status, detail });
        const mkPointerSeq = window.__hwClick;

        if (!window.__hwGenBtnFound) { log('P4.2', 'ABORT', 'gen btn missing from P4.1'); return { ok: false }; }
        if (!window.__hwIsRelax) { log('P4.2', 'ABORT', 'NOT Relax mode (生成 N != 0) · refusing to click'); return { ok: false }; }
        if (window.__hwChipOk === false) { log('P4.2', 'ABORT', 'chip-binding FAILED (P3.7) · refusing to submit'); return { ok: false }; }

        const buttons = Array.from(document.querySelectorAll('button'));
        const generateBtn = buttons.find(b => {
          const txt = (b.innerText || '').trim();
          return /^生成/.test(txt) && !txt.includes('快速');
        });
        if (!generateBtn) { log('P4.2', 'ABORT', '生成 btn vanished'); return { ok: false }; }
        const txt = (generateBtn.innerText || '').trim();
        if (!/生成\s*0(?:\s|$)/.test(txt)) { log('P4.2', 'ABORT', `生成 txt='${txt.replace(/\n/g, ' ')}' not 0 cr`); return { ok: false }; }

        await mkPointerSeq(generateBtn);
        log('P4.2', 'OK', `生成 clicked · txt='${txt.replace(/\n/g, ' ')}'`);
        return { ok: true };
      })()

  - wait: 5

  - evaluate: |
      (async () => {
        const log = (phase, status, detail) => window.__hwLog.push({ phase, status, detail });
        let balanceText = 'UNKNOWN';
        const candidates = Array.from(document.querySelectorAll('button, span, div'));
        for (const el of candidates) {
          if (el.children.length > 5) continue;
          const t = (el.innerText || '').trim();
          if (/^\d{1,5}(?:\.\d+)?\s*\n?\s*Ultra\s*$/.test(t)) {
            balanceText = t.replace(/\s+/g, ' '); break;
          }
        }
        const allText = (document.body.innerText || '');
        const queueHints = [];
        if (/生成中|排隊|Queued|Generating|提交成功|任務|很抱歉/i.test(allText)) {
          const els = Array.from(document.querySelectorAll('*')).filter(el => /生成中|排隊|提交成功|任務|很抱歉/i.test((el.innerText || '').trim()) && (el.innerText || '').length < 100 && el.children.length === 0);
          queueHints.push(...els.slice(0, 3).map(el => (el.innerText || '').trim().slice(0, 60)));
        }
        log('P4.3', 'OK', `balance_after='${balanceText}' queueHints=[${queueHints.join('|')}]`);
        return { ok: true };
      })()

  # ────────────────────────────────────────────────────────────────────────
  # FINAL · dump entire window.__hwLog as table
  # ────────────────────────────────────────────────────────────────────────
  - evaluate: |
      (window.__hwLog || [{ phase: 'NONE', status: 'EMPTY', detail: 'log array missing' }])

  - map:
      phase: ${{ item.phase }}
      status: ${{ item.status }}
      detail: ${{ item.detail }}
