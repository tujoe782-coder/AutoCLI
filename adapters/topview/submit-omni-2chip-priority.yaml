# Topview Seedance 2.0 Omni Reference · 2-chip PRIORITY submit (S317 v1.1 ship)
#
# Derived from: submit-omni-1chip-priority.yaml + submit-omni-2chip.yaml
# Key fixes (vs prior variants):
#   - gh#24 P0→P1 merge (INIT post-navigate · window state preserved)
#   - gh#25 mkPointerSeq double-click bug FIX (P4.2 生成 click via CDP single-fire · NOT mkPointerSeq)
#   - gh#27 resolution arg gap WORKAROUND (Sunny pre-set 480P in Topview UI · adapter doesn't explicit set)
#   - Chevron switch (P1.5) hardcoded verbatim coords from S317 chevron-recon (chevron 478/721 · 點數模式 346/549)
#
# Use cases:
#   - B.2 F4 b10 cross-sheet 1.2→1.3a retake (Emma face + sheet 1.2-end-anchor jpg)
#   - B.3 F7 b18b cross-sheet 1.5→1.6 retake (Emma face + sheet 1.5 b18a last-frame)
#   - F5/F6 if Sunny lock Topview dual-axis (Emma face + b15/b17 last-frame)
#
# Prompt structure (REQUIRED): [prose0] @Image1 [prose1] @Image2 [prose2]
# Cost: 7.5 cr/submit @ 480P (Sunny pre-set · adapter verifies via "生成 7.5" regex)
#
# License: Apache-2.0

site: topview
name: submit-omni-2chip-priority
description: Topview Seedance 2-chip PRIORITY submit · 7.5 cr/submit @ 480P · last-frame chain pattern · single-click submit (gh#25 fix)
domain: www.topview.ai
strategy: cookie
browser: true
# S321 gh#34 · pipeline 含完整 P1→P3 約 17 min wall · 預設 60s 會 swallow log。1800s = 30min upper bound.
timeoutSeconds: 1800

args:
  asset_idxes:
    type: string
    required: true
    description: 2 comma-separated 0-indexed positions in ep01-character-bank board (e.g. "2,14") · first → @Image1 · second → @Image2
  prompt:
    type: string
    required: true
    description: Prose with @Image1 + @Image2 markers · structure "[prose0] @Image1 [prose1] @Image2 [prose2]" · max 15000 chars
  duration:
    type: int
    default: 4
    description: 4 | 5 | 6 | 8 | 10 | 15 seconds (default 4 · S318 gh#27 supports full Topview range)
  resolution:
    type: string
    default: "480p"
    description: 480p | 720p | 1080p (default 480p · per S318 Sunny lock · gh#27 ship)
  output_name:
    type: string
    required: true
    description: Output identifier (logged · downloaded mp4 filename hint)

columns: [phase, status, detail]

pipeline:
  # ===========================================================================
  # P1 · navigate + INIT (post-navigate · gh#24 fix) + args validate + panel open
  # ===========================================================================
  - navigate: https://www.topview.ai/board/4cc8183920c849cca4a871c58651e1b3
  - wait: 4

  - evaluate: |
      (async () => {
        // ============ INIT (post-navigate) ============
        window.__omniLog = [];
        window.__omniAbort = false;
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });

        // ============ args validate ============
        const asset_idxes_str = ${{ args.asset_idxes | json }};
        const prompt = ${{ args.prompt | json }};
        const output_name = ${{ args.output_name | json }};
        const target_resolution = ${{ args.resolution | json }};
        const target_duration = ${{ args.duration | json }};

        // S318 gh#27 · resolution + duration enum validate
        const valid_res = ['480p', '720p', '1080p'];
        const valid_dur = [4, 5, 6, 8, 10, 15];
        if (!valid_res.includes(String(target_resolution).toLowerCase())) {
          log('P0', 'FAIL', `INVALID_RESOLUTION '${target_resolution}' · must be one of ${valid_res.join('|')}`);
          window.__omniAbort = true;
          return { ok: false };
        }
        if (!valid_dur.includes(parseInt(target_duration))) {
          log('P0', 'FAIL', `INVALID_DURATION ${target_duration} · must be one of ${valid_dur.join('|')}`);
          window.__omniAbort = true;
          return { ok: false };
        }

        // S318 gh#27 · cost matrix · per-second scaling · gen btn shows expected cost
        // Topview 證實: 480P 5s=2.5cr · 720P 15s=15cr · linear per-second per-res
        const COST_PER_SEC = { '480p': 0.5, '720p': 1.0, '1080p': 2.5 };  // gh#29 Cowork verified S319 · 1080P=2.5 NOT 2.0
        const expected_cost = COST_PER_SEC[String(target_resolution).toLowerCase()] * parseInt(target_duration);
        window.__omniTargetRes = String(target_resolution).toLowerCase();
        window.__omniTargetDur = parseInt(target_duration);
        window.__omniExpectedCost = expected_cost;

        if (prompt.length > 15000) {
          log('P0', 'FAIL', `PROMPT_TOO_LONG ${prompt.length}/15000`);
          window.__omniAbort = true;
          return { ok: false };
        }
        if (prompt.length > 5000) {
          log('P0', 'INFO', `prompt ${prompt.length}c · exceeds webUI 5000 counter · expect yellow warning · submit proceeds`);
        }

        const idxes = asset_idxes_str.split(',').map(s => parseInt(s.trim()));
        if (idxes.length !== 2) {
          log('P0', 'FAIL', `EXPECTED_2_IDXES got ${idxes.length} (${asset_idxes_str})`);
          window.__omniAbort = true;
          return { ok: false };
        }
        if (idxes.some(i => isNaN(i) || i < 0 || i > 30)) {
          log('P0', 'FAIL', `INVALID_IDX in ${asset_idxes_str}`);
          window.__omniAbort = true;
          return { ok: false };
        }

        // Parse prompt segments
        const tokens = prompt.split(/(@Image\d+)/);
        const segments = [];
        const chipsFound = new Set();
        for (const t of tokens) {
          const m = t.match(/^@Image(\d+)$/);
          if (m) {
            chipsFound.add(parseInt(m[1]));
            segments.push({ type: 'chip', n: parseInt(m[1]) });
          } else if (t) {
            segments.push({ type: 'prose', text: t });
          }
        }
        if (!chipsFound.has(1) || !chipsFound.has(2) || chipsFound.size !== 2) {
          log('P0', 'FAIL', `CHIPS_MISMATCH expected {1,2} got {${[...chipsFound].sort().join(',')}}`);
          window.__omniAbort = true;
          return { ok: false };
        }
        const chipSeq = segments.filter(s => s.type === 'chip').map(s => s.n);
        if (chipSeq.join(',') !== '1,2') {
          log('P0', 'FAIL', `CHIP_ORDER_WRONG got [${chipSeq.join(',')}] · must be [1,2]`);
          window.__omniAbort = true;
          return { ok: false };
        }

        let prose0 = '', prose1 = '', prose2 = '';
        let phase = 0;
        for (const seg of segments) {
          if (seg.type === 'chip') { phase++; continue; }
          if (phase === 0) prose0 += seg.text;
          else if (phase === 1) prose1 += seg.text;
          else prose2 += seg.text;
        }

        window.__omniIdxes = idxes;
        window.__omniProse0 = prose0;
        window.__omniProse1 = prose1;
        window.__omniProse2 = prose2;
        window.__omniOutputName = output_name;
        window.__omniSlotBound = 0;

        log('P0', 'OK', `idxes=[${idxes.join(',')}] prose0=${prose0.length}c prose1=${prose1.length}c prose2=${prose2.length}c output=${output_name} mode=PRIORITY res=${window.__omniTargetRes} dur=${window.__omniTargetDur}s expectedCost=${window.__omniExpectedCost}cr`);

        // ============ Cloudflare + panel open ============
        if (document.title.includes('Just a moment') || document.title.includes('正在驗證')) {
          log('P1.0', 'FAIL', 'CLOUDFLARE_BLOCKED');
          window.__omniAbort = true;
          return { ok: false };
        }

        const mkPointerSeq = async (rawEl) => {
          let el = rawEl;
          if (el && el.tagName && el.tagName.toLowerCase() === 'svg' && el.parentElement) {
            el = el.parentElement;
          }
          const r = el.getBoundingClientRect();
          const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          const mk = (t) => new MouseEvent(t, { bubbles: true, cancelable: true, view: window, clientX: cx, clientY: cy, button: 0 });
          el.dispatchEvent(new PointerEvent('pointerover', { bubbles: true, cancelable: true, clientX: cx, clientY: cy }));
          el.dispatchEvent(new PointerEvent('pointerenter', { bubbles: true, cancelable: true, clientX: cx, clientY: cy }));
          el.dispatchEvent(mk('mouseover'));
          el.dispatchEvent(mk('mouseenter'));
          await new Promise(r => setTimeout(r, 200));
          el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, clientX: cx, clientY: cy }));
          el.dispatchEvent(mk('mousedown'));
          el.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true, clientX: cx, clientY: cy }));
          el.dispatchEvent(mk('mouseup'));
          el.dispatchEvent(mk('click'));
          if (typeof el.click === 'function') el.click();
        };
        window.__omniClick = mkPointerSeq;

        const videoBtn = Array.from(document.querySelectorAll('button')).find(b => (b.innerText || '').trim() === '影片');
        if (!videoBtn) { log('P1.1', 'FAIL', 'VIDEO_BTN_NOT_FOUND'); window.__omniAbort = true; return { ok: false }; }
        await mkPointerSeq(videoBtn);
        await new Promise(r => setTimeout(r, 5500));
        log('P1.1', 'OK', 'video panel opened');

        const seedanceBtn = Array.from(document.querySelectorAll('button')).find(b => (b.innerText || '').includes('全參考'));
        if (!seedanceBtn) { log('P1.2', 'FAIL', 'SEEDANCE_BTN_NOT_FOUND'); window.__omniAbort = true; return { ok: false }; }
        await mkPointerSeq(seedanceBtn);
        await new Promise(r => setTimeout(r, 3000));
        log('P1.2', 'OK', 'SEEDANCE2 panel opened');
        return { ok: true };
      })()

  # ===========================================================================
  # P1.5 · CHEVRON CLICK → 點數模式 → verify priority active
  # (S317 chevron-recon verbatim coords · CDP trusted · evaluate-cdp pattern)
  # ===========================================================================

  # P1.5.1 chevron click @ (478, 721)
  - evaluate: |
      ({ x: 478, y: 721 })
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseMoved
        x: ${{ data.x }}
        y: ${{ data.y }}
        button: none
        buttons: 0
        clickCount: 0

  - evaluate: |
      ({ x: 478, y: 721 })
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mousePressed
        x: ${{ data.x }}
        y: ${{ data.y }}
        button: left
        buttons: 1
        clickCount: 1

  - evaluate: |
      ({ x: 478, y: 721 })
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseReleased
        x: ${{ data.x }}
        y: ${{ data.y }}
        button: left
        buttons: 0
        clickCount: 1

  - wait: 2

  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        // Detect if chevron click opened popup (popup may already be in priority state from prior session)
        const buttons = Array.from(document.querySelectorAll('button'));
        const generateBtn = buttons.find(b => {
          const txt = (b.innerText || '').trim();
          return /^生成/.test(txt) && !txt.includes('快速');
        });
        if (generateBtn) {
          const genText = (generateBtn.innerText || '').trim().replace(/\n/g, ' ');
          // Priority active = "生成 N" where N > 0 (7.5 / 15 / 30 etc · resolution-dependent)
          const isPriority = /^生成\s*(\d+(?:\.\d+)?)/.test(genText) && !/^生成\s*0(?:\s|$)/.test(genText);
          log('P1.5.1', isPriority ? 'OK' : 'INFO', `pre-click-點數模式 gen='${genText}' isPriority=${isPriority}`);
          if (isPriority) {
            // Already in priority mode · skip 點數模式 click (chevron click may have just toggled popup or noop)
            log('P1.5.skip', 'OK', 'priority mode already active · skipping 點數模式 click');
            window.__omniPrioritySkipClick = true;
          } else {
            window.__omniPrioritySkipClick = false;
          }
        }
        return { ok: true };
      })()

  # P1.5.2 點數模式 click @ (346, 549) — only if needed
  - evaluate: |
      (async () => {
        if (window.__omniPrioritySkipClick) return { x: 0, y: 0 };
        return { x: 346, y: 549 };
      })()
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseMoved
        x: ${{ data.x }}
        y: ${{ data.y }}
        button: none
        buttons: 0
        clickCount: 0

  - evaluate: |
      (async () => {
        if (window.__omniPrioritySkipClick) return { x: 0, y: 0 };
        return { x: 346, y: 549 };
      })()
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mousePressed
        x: ${{ data.x }}
        y: ${{ data.y }}
        button: left
        buttons: 1
        clickCount: 1

  - evaluate: |
      (async () => {
        if (window.__omniPrioritySkipClick) return { x: 0, y: 0 };
        return { x: 346, y: 549 };
      })()
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseReleased
        x: ${{ data.x }}
        y: ${{ data.y }}
        button: left
        buttons: 0
        clickCount: 1

  - wait: 2

  # P1.5.3 verify priority active · capture cost
  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        const buttons = Array.from(document.querySelectorAll('button'));
        const generateBtn = buttons.find(b => {
          const txt = (b.innerText || '').trim();
          return /^生成/.test(txt) && !txt.includes('快速');
        });
        if (!generateBtn) {
          log('P1.5.3', 'FAIL', 'GENERATE_BTN_NOT_FOUND post mode switch');
          window.__omniAbort = true;
          return { ok: false };
        }
        const genText = (generateBtn.innerText || '').trim().replace(/\n/g, ' ');
        const costMatch = genText.match(/^生成\s*(\d+(?:\.\d+)?)/);
        const cost = costMatch ? parseFloat(costMatch[1]) : null;
        if (!cost || cost <= 0) {
          log('P1.5.3', 'FAIL', `gen btn='${genText}' (expected '生成 N' with N>0) · priority mode switch FAILED`);
          window.__omniAbort = true;
          return { ok: false };
        }
        const gr = generateBtn.getBoundingClientRect();
        window.__omniGenBtnX = Math.round(gr.left + gr.width / 2);
        window.__omniGenBtnY = Math.round(gr.top + gr.height / 2);
        window.__omniCost = cost;
        window.__omniPriorityActive = true;
        log('P1.5.3', 'OK', `priority active · gen='${genText}' cost=${cost} cr · genBtn=(${window.__omniGenBtnX},${window.__omniGenBtnY})`);
        return { ok: true };
      })()


  # ===========================================================================
  # S320 gh#32 REORDER · P1.6/P1.7/P1.8 moved AFTER P2 chooser bind
  # Reason: dropdown popover residual state breaks subsequent chooser asset binding
  # Probe v6 confirmed mkPointerSeq BOUND idx 4 in NO-dropdown state · take5 NO-BIND with dropdowns
  # Pipeline: P1 init → P1.5 priority → P2 chooser bind (BOTH slots) → P1.6 res → P1.7 dur → P1.8 verify → P3 prompt → P4 submit
  # ===========================================================================
  # ===========================================================================
  # P2 · SLOT 1 chooser flow (asset_idxes[0] → @Image1)
  # ===========================================================================

  # P2.S1.1 HOVER (128,287)
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseMoved
        x: 128
        y: 287
        button: none
        buttons: 0
        clickCount: 0
  - wait: 2

  # P2.S1.2 CLICK (117,315) sub-icon
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseMoved
        x: 117
        y: 315
        button: none
        buttons: 0
        clickCount: 0
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mousePressed
        x: 117
        y: 315
        button: left
        buttons: 1
        clickCount: 1
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseReleased
        x: 117
        y: 315
        button: left
        buttons: 0
        clickCount: 1
  - wait: 1

  # P2.S1.3 CLICK (137,220) 圖片
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseMoved
        x: 137
        y: 220
        button: none
        buttons: 0
        clickCount: 0
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mousePressed
        x: 137
        y: 220
        button: left
        buttons: 1
        clickCount: 1
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseReleased
        x: 137
        y: 220
        button: left
        buttons: 0
        clickCount: 1
  - wait: 2

  # P2.S1.4 Locate asset idx[0]
  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        if (window.__omniAbort) { log('P2.S1.4', 'SKIP', 'aborted'); return { x: 977, y: 240, fail: true }; }

        const idx = window.__omniIdxes[0];
        const assetImgs = Array.from(document.querySelectorAll('img')).filter(im => {
          const r = im.getBoundingClientRect();
          return r.width > 50 && r.height > 50 && r.top > 50 && r.top < window.innerHeight - 50
              && (im.src || '').includes('Key-Pair-Id') && !(im.alt || '').match(/Loading|topview/i);
        }).sort((a, b) => {
          const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
          const rowA = Math.round(ra.top / 30), rowB = Math.round(rb.top / 30);
          if (rowA !== rowB) return rowA - rowB;
          return ra.left - rb.left;
        });

        if (assetImgs.length <= idx) {
          log('P2.S1.4', 'FAIL', `idx ${idx} OOR · only ${assetImgs.length}`);
          window.__omniAbort = true;
          return { x: 977, y: 240, fail: true };
        }
        // S318 probe enhancement · dump full asset roster src+alt+coord for Emma idx identification
        const isProbe = (window.__omniOutputName || '').startsWith('PROBE-');
        if (isProbe) {
          const roster = assetImgs.map((im, i) => {
            const br = im.getBoundingClientRect();
            const cx = Math.round(br.left + br.width / 2);
            const cy = Math.round(br.top + br.height / 2);
            const srcId = (im.src || '').match(/[?&]([^&=]+)=([^&]+)/g) ? (im.src || '').slice(-80) : (im.src || '').slice(-80);
            const altText = (im.alt || '').slice(0, 40);
            return `[${i}] coord=(${cx},${cy}) alt='${altText}' srcEnd='${srcId}'`;
          });
          log('P2.S1.4-PROBE', 'OK', `total=${assetImgs.length} roster:\n${roster.join('\n')}`);
        }
        const r = assetImgs[idx].getBoundingClientRect();
        const x = Math.round(r.left + r.width / 2);
        const y = Math.round(r.top + r.height / 2);
        window.__omniS1X = x;
        window.__omniS1Y = y;
        log('P2.S1.4', 'OK', `idx=${idx} of ${assetImgs.length} · coord=(${x},${y})`);
        return { x, y };
      })()

  # P2.S1.5 CLICK asset → bind @Image1
  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        if (window.__omniAbort) { log('P2.S1.5', 'SKIP', 'aborted'); return { ok: false }; }
        const idx = window.__omniIdxes[0];
        const assetImgs = Array.from(document.querySelectorAll('img')).filter(im => {
          const r = im.getBoundingClientRect();
          return r.width > 50 && r.height > 50 && r.top > 50 && r.top < window.innerHeight - 50
              && (im.src || '').includes('Key-Pair-Id') && !(im.alt || '').match(/Loading|topview/i);
        }).sort((a, b) => {
          const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
          const rowA = Math.round(ra.top / 30), rowB = Math.round(rb.top / 30);
          if (rowA !== rowB) return rowA - rowB;
          return ra.left - rb.left;
        });
        if (assetImgs.length <= idx) {
          log('P2.S1.5', 'FAIL', `idx ${idx} OOR · only ${assetImgs.length}`);
          window.__omniAbort = true;
          return { ok: false };
        }
        const targetImg = assetImgs[idx];
        await window.__omniClick(targetImg);
        await new Promise(r => setTimeout(r, 4500));
        log('P2.S1.5', 'OK', `mkPointerSeq click on idx=${idx} (S320 gh#32 fix · 4.5s wait per Sunny: select happened, closed too fast)`);
        return { ok: true };
      })()
  - wait: 2

  # P2.S1.6 verify slot 1 bound
  - evaluate: |
      (async () => {
        const log = (p, s, d) => window.__omniLog.push({ phase: p, status: s, detail: d });
        const slotIndicators = Array.from(document.querySelectorAll('div, span, button, img'))
          .filter(el => /^@?Image\s*1$/i.test((el.innerText || '').trim()) && (el.innerText || '').trim().length < 12);
        const panelSlotImgs = Array.from(document.querySelectorAll('img')).filter(im => {
          const r = im.getBoundingClientRect();
          return r.left < 510 && r.left > 50 && r.top > 200 && r.top < 500 && r.width > 30 && r.height > 30
              && (im.src || '').includes('Key-Pair-Id');
        });
        const cancelBtn = Array.from(document.querySelectorAll('button')).find(b => (b.innerText || '').trim() === '取消');
        const ok = slotIndicators.length > 0 || panelSlotImgs.length > 0;
        if (ok) window.__omniSlotBound = 1;
        log('P2.S1.6', ok ? 'OK' : 'WARN',
          `slot1 indicators=${slotIndicators.length} panelImgs=${panelSlotImgs.length} chooserOpen=${!!cancelBtn}`);
        // S318 probe abort sentinel · output_name starts with "PROBE-" → halt before slot 2 + submit (zero cost)
        if ((window.__omniOutputName || '').startsWith('PROBE-')) {
          window.__omniAbort = true;
          log('P2.S1.6-PROBE-ABORT', 'OK', 'probe mode · halting before slot 2 + P3/P4 · zero cost');
        }
        return { ok };
      })()

  # ===========================================================================
  # P2 · SLOT 2 chooser flow (asset_idxes[1] → @Image2)
  # Re-open chooser (auto-closed after slot 1)
  # ===========================================================================

  # P2.S2.1 HOVER (232,287) · slot 2 匯入 box center · S320 gh#32 Cowork fix
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseMoved
        x: 232
        y: 287
        button: none
        buttons: 0
        clickCount: 0
  - wait: 2

  # P2.S2.2 CLICK (232,316) sub-icon · slot 2 看板 button center
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseMoved
        x: 232
        y: 316
        button: none
        buttons: 0
        clickCount: 0
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mousePressed
        x: 232
        y: 316
        button: left
        buttons: 1
        clickCount: 1
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseReleased
        x: 232
        y: 316
        button: left
        buttons: 0
        clickCount: 1
  - wait: 1

  # P2.S2.3 CLICK (242,220) 圖片 · dropdown shifted right with slot
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseMoved
        x: 242
        y: 220
        button: none
        buttons: 0
        clickCount: 0
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mousePressed
        x: 242
        y: 220
        button: left
        buttons: 1
        clickCount: 1
  - cdp:
      method: Input.dispatchMouseEvent
      params:
        type: mouseReleased
        x: 242
        y: 220
        button: left
        buttons: 0
        clickCount: 1
  - wait: 2

  # P2.S2.4 Locate asset idx[1]
